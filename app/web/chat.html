<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 16px;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }
        /* ---------- Боковая панель: история юзера ---------- */
        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .sidebar h2 {
            margin: 0 0 12px;
            font-size: 1rem;
            color: #4a3b8f;
        }
        .user-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            background: #f0ebff;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.85rem;
            word-break: break-word;
            border-left: 4px solid #667eea;
        }
        .history-empty {
            color: #999;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 20px;
        }
        /* ---------- Основная область чата ---------- */
        .chat {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .chat-header {
            padding: 16px 20px;
            background: #5b4bb8;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .chat-header .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: auto;
        }
        .chat-header .avatar { font-size: 1.6rem; }
        .chat-header h1 { margin: 0; font-size: 1.2rem; }
        .chat-header .sub { font-size: 0.8rem; opacity: 0.85; }
        .chat-settings {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .chat-settings label {
            font-size: 0.85rem;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-settings select,
        .chat-settings input {
            padding: 7px 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #333;
            background: #fff;
            outline: none;
        }
        .chat-settings input { width: 130px; }
        .chat-settings input::placeholder { color: #999; }
        .chat-settings #stop-condition { width: 190px; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg { display: flex; }
        .msg.user { justify-content: flex-end; }
        .msg.bot { justify-content: flex-start; }
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .bubble {
            background: #667eea;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.bot .bubble {
            background: #eee6ff;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #ececec;
            background: #fff;
        }
        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row input:focus { border-color: #667eea; }
        .input-row button {
            padding: 12px 22px;
            border: none;
            border-radius: 24px;
            background: #667eea;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-row button:hover { background: #5563c1; }
        .input-row button:disabled { background: #aaa; cursor: not-allowed; }
        .typing {
            color: #888;
            font-size: 0.85rem;
            padding: 4px 16px 0;
        }
        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Боковая панель: история введённых данных юзером -->
        <aside class="sidebar">
            <h2>🕘 История введённых данных</h2>
            <div id="history" class="user-history">
                <div class="history-empty">Здесь появится, что вы вводили</div>
            </div>
        </aside>

        <!-- Основное окно чата -->
        <main class="chat">
            <div class="chat-header">
                <div class="title-group">
                    <span class="avatar">🤖</span>
                    <div>
                        <h1>Чат-бот</h1>
                        <div class="sub">DeepSeek · Yandex Cloud · демо-режим при сбое</div>
                    </div>
                </div>
                <div class="chat-settings">
                    <label>Формат ответа
                        <select id="format">
                            <option value="free" selected>свободный</option>
                            <option value="json">json</option>
                        </select>
                    </label>
                    <label>Длина
                        <input id="max-length" type="text" inputmode="numeric" placeholder="Макс. токенов (целое)" autocomplete="off">
                    </label>
                    <label>Завершение
                        <input id="stop-condition" type="text" placeholder="стоп, напр. 7 / синий (через запятую)" autocomplete="off">
                    </label>
                </div>
            </div>
            <div id="messages" class="messages">
                <div class="msg bot">
                    <div class="bubble">Привет! 👋 Я демо-чат-бот. Напишите что-нибудь в поле ниже.</div>
                </div>
            </div>
            <div id="typing" class="typing"></div>
            <div class="input-row">
                <input id="input" type="text" placeholder="Введите сообщение..." autocomplete="off">
                <button id="send">Отправить</button>
            </div>
        </main>
    </div>

    <script>
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const messagesEl = document.getElementById('messages');
        const historyEl = document.getElementById('history');
        const typingEl = document.getElementById('typing');
        const maxLengthInput = document.getElementById('max-length');
        const formatSelect = document.getElementById('format');
        const stopInput = document.getElementById('stop-condition');

        // Поле «Длина» принимает только целые числа (не пропускаем не-цифры).
        maxLengthInput.addEventListener('input', () => {
            maxLengthInput.value = maxLengthInput.value.replace(/\D/g, '');
        });

        function addHistory(text) {
            // убрать заглушку
            const empty = historyEl.querySelector('.history-empty');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = 'history-item';
            div.textContent = text;
            historyEl.prepend(div);
        }

        function addMessage(role, text) {
            const wrap = document.createElement('div');
            wrap.className = 'msg ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            wrap.appendChild(bubble);
            messagesEl.appendChild(wrap);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function send() {
            const content = input.value.trim();
            if (!content) return;

            // Валидация длины: пустое поле — по умолчанию; иначе только целое > 0.
            let maxTokens = null;
            const rawLength = maxLengthInput.value.trim();
            if (rawLength !== '') {
                const num = Number(rawLength);
                if (!/^\d+$/.test(rawLength) || num < 1) {
                    addMessage('bot', '⚠️ Длина ответа должна быть целым числом больше нуля.');
                    input.focus();
                    return;
                }
                maxTokens = num;
            }

            input.value = '';
            sendBtn.disabled = true;

            addMessage('user', content);
            addHistory(content);

            // Выбранный формат ответа: 'free' (по умолчанию) или 'json'
            const format = formatSelect.value;

            // Условие завершения: строка, на которой остановить генерацию.
            const stopValue = stopInput.value.trim() || null;

            typingEl.textContent = 'ДемоБот печатает...';
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content,
                        format,
                        max_tokens: maxTokens,
                        stop: stopValue
                    })
                });
                const data = await res.json();
                addMessage('bot', data.bot);
            } catch (e) {
                addMessage('bot', '⚠️ Ошибка связи с сервером. Попробуйте ещё раз.');
            } finally {
                typingEl.textContent = '';
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });
        input.focus();
    </script>
</body>
</html>
