# AI-РЕВЬЮ ИЗМЕНЕНИЙ НА PULL REQUEST.
#
# ЧТО ДЕЛАЕТ. На каждый pull request запускается разбор изменений: агент берёт
# diff ветки через MCP-сервер `git` (только чтение), контекст кода и документации
# из самого репозитория, зовёт модель и публикует отчёт тремя разделами —
# потенциальные баги, архитектурные проблемы, рекомендации. Тот же движок, что у
# команды `/ai_review` в чате (app/ai/ai_review_run.py): здесь только собираются
# вход и публикация.
#
# ПОЧЕМУ НЕ ЧЕРЕЗ ПРИЛОЖЕНИЕ. В CI нет ни рабочего файла проекта
# (`data/` не хранится в git), ни баз знаний, ни локальной модели — поэтому
# запускается вход `tools/ai_review.py`, которому всё это и не нужно.
#
# ГДЕ ЗАПУСКАТЬ: ОБЛАЧНЫЙ РАННЕР ИЛИ СВОЙ. По умолчанию — облачный
# (ubuntu-latest). Своя машина подключается так: зарегистрировать её как
# self-hosted runner (Settings → Actions → Runners; проще всего скриптом
# `tools/review_runner.sh`, он же проверяет готовность машины), а затем завести
# переменную репозитория AI_REVIEW_RUNNER со значением её метки, например
# `ai-review`. Тогда `runs-on` уходит на неё, и ревью получает то, чего в облаке
# нет: пакет эмбеддингов с кэшем моделей в `data/rag/models` (семантический
# поиск по коду), постоянный каталог индекса (индекс переживает прогоны) и
# возможность выключить ревью прямо в приложении на этой же машине.
#
# ЧТО НУЖНО ЗАВЕСТИ В РЕПОЗИТОРИИ (Settings → Secrets and variables → Actions):
#   * КЛЮЧ МОДЕЛИ — одним из двух способов (без него ревью не делается, и это
#     НЕ считается сбоем: прогон завершается успешно с названной причиной):
#     — секрет DEEPSEEK_API_KEY — для ОБЛАЧНОГО раннера: у него нет ни `.env`,
#       ни проекта, и ключ ему взять неоткуда;
#     — НИЧЕГО НЕ НУЖНО — для СВОЕЙ машины: `tools/review_runner.sh start`
#       передаёт раннеру ключ из `.env` проекта, а задачи наследуют окружение
#       раннера (секрет в GitHub при этом можно не заводить вовсе);
#   * ПЕРВЫЙ ШАГ ПРОГОНА ЧИТАЕТ РЕЖИМ У ПРОЕКТА. Главный рубильник ревью —
#     команды `/ai_review_enable` и `/ai_review_disable` в чате (настройка
#     проекта): выключен режим — прогон завершается за секунды, не ставя
#     зависимости, не собирая индекс и не тратя вызовы модели. На СВОЕЙ машине
#     связь настраивать не нужно: `tools/review_runner.sh start` передаёт задачам
#     путь к файлу проекта (AI_REVIEW_WORKSPACE). Для ОБЛАЧНОГО раннера файл
#     проекта недоступен, поэтому там команды не действуют и нужна переменная;
#   * переменная AI_REVIEW_ENABLED — АВАРИЙНЫЙ ТОРМОЗ: значение `off` выключает
#     ревью целиком, не трогая приложение (например на время заморозки). Любое
#     другое значение (в том числе пустое — переменной нет) ничего не выключает. Это парная настройка к командам `/ai_review_enable` и
#     `/ai_review_disable` в чате: там режим живёт у ПРОЕКТА, здесь — у
#     РЕПОЗИТОРИЯ, потому что у пайплайна нет доступа к локальному проекту.
#   * НА СВОЕЙ МАШИНЕ ПИТОН НЕ СТАВИТСЯ, БЕРЁТСЯ СВОЙ —
#     `tools/review_runner.sh start` передаёт задачи интерпретатор проекта
#     (AI_REVIEW_PYTHON), в котором стоят эмбеддинги; без этого RAG по коду
#     молча ушёл бы на лексический офлайн-бэкенд;
#   * НА СВОЕЙ МАШИНЕ ЭТО МОЖНО СВЯЗАТЬ: переменная AI_REVIEW_WORKSPACE с путём
#     к рабочему файлу проекта (`data/agent_workspace.json` каталога, где стоит
#     приложение) — тогда команды `/ai_review_enable` и `/ai_review_disable`
#     управляют и пайплайном;
#   * переменные (нужны только на self-hosted): AI_REVIEW_RUNNER — метка раннера;
#     AI_REVIEW_INDEX_DIR — каталог индекса кода ВНЕ рабочей копии (например
#     `/Users/you/ai-review-index`), иначе индекс собирается заново каждый прогон;
#     AI_REVIEW_RAG — `auto` (по умолчанию), `on` (требовать индекс, сбой без
#     него) или `off` (контекст отбирается кодом, без RAG).
#
# ЧЕГО ПАЙПЛАЙН НЕ ДЕЛАЕТ. Не падает из-за НАХОДОК (ревью — не проверка сборки и
# не гейт: красный статус из-за мнения модели обесценил бы и то, и другое) и не
# трогает код: сервер git на чтение, шаги ничего не коммитят и не пушат.

name: AI-ревью изменений

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Права минимальные: читать код и писать комментарий к pull request. Правки
# файлов пайплайну не нужны вовсе.
permissions:
  contents: read
  pull-requests: write

# Новый push в ту же ветку отменяет прежний прогон: ревью устаревшей версии
# никому не нужно, а вызовы модели стоят денег.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # РУБИЛЬНИК И ЧЕРНОВИКИ: переменная репозитория `off` выключает ревью, а
    # черновик pull request не проверяется — автор ещё пишет код.
    if: ${{ vars.AI_REVIEW_ENABLED != 'off' && !github.event.pull_request.draft }}
    # СВОЙ РАННЕР — ПЕРЕМЕННОЙ, а не вторым файлом: один workflow работает и в
    # облаке, и на своей машине, и «где именно считалось ревью» видно в прогоне.
    runs-on: ${{ vars.AI_REVIEW_RUNNER || 'ubuntu-latest' }}
    # На своей машине индексация кода с моделью эмбеддингов — это минуты, поэтому
    # запас времени больше облачного.
    timeout-minutes: 45
    steps:
      - name: Получить код вместе с историей базовой ветки
        uses: actions/checkout@v4
        with:
          # История нужна целиком: ревью сравнивает ветку с базовой через
          # `git merge-base`, а неглубокий клон (по умолчанию fetch-depth: 1)
          # оставил бы общую точку ветвления за пределами клона.
          fetch-depth: 0

      - name: Убедиться, что базовая ветка есть локально
        # Проверка дешёвая, а без неё сервер git честно откажет «не нашёл базовую
        # ветку» — и это выглядело бы как поломка ревью, а не как неполный клон.
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Python 3.12 (только в облаке)
        # НА СВОЕЙ МАШИНЕ ПИТОН НЕ СТАВИТСЯ. Он там уже есть — вместе с пакетом
        # эмбеддингов и кэшем моделей, — а `actions/setup-python` на macOS падает:
        # он раскладывает интерпретатор в /Users/runner/hostedtoolcache, куда
        # писать нельзя (живой прогон 14.10: «mkdir: /Users/runner: Operation not
        # permitted»). В облаке ставим: там нужен предсказуемый 3.12.
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Какой питон работает и есть ли эмбеддинги
        # ИНТЕРПРЕТАТОР БЕРЁТСЯ ОТ МАШИНЫ (AI_REVIEW_PYTHON из окружения раннера,
        # его ставит `tools/review_runner.sh start`): в venv проекта лежит
        # sentence-transformers и кэш моделей, а без них RAG по коду молча уходит
        # на лексический офлайн-бэкенд. Ищем и говорим прямо, чем считаем.
        run: |
          set -eu
          PY="${AI_REVIEW_PYTHON:-}"
          if [ -z "$PY" ] || [ ! -x "$PY" ]; then
            PY="$(command -v python3)"
          fi
          echo "PYTHON=$PY" >> "$GITHUB_ENV"
          echo "Интерпретатор: $PY ($("$PY" --version 2>&1))"
          "$PY" - <<'PYCODE'
          try:
              import sentence_transformers  # noqa: F401
              print("Эмбеддинги: пакет sentence-transformers доступен — поиск будет семантическим")
          except Exception as exc:                       # noqa: BLE001
              print("Эмбеддинги: пакета нет (%s) — индекс посчитается офлайн-бэкендом" % type(exc).__name__)
          PYCODE

      - name: Режим AI-ревью у проекта (рубильник из чата)
        # ГЛАВНЫЙ РУБИЛЬНИК — КОМАНДЫ `/ai_review_enable` и `/ai_review_disable`:
        # ревью делает ровно то, что записано в настройке проекта. Файл проекта
        # приходит задачам из окружения раннера (`tools/review_runner.sh start`
        # ставит AI_REVIEW_WORKSPACE) или из переменной репозитория. Решение
        # принимает ТОТ ЖЕ код, что и сам прогон, — спрашиваем его и по ответу
        # пропускаем тяжёлые шаги: при выключенном режиме не ставятся зависимости,
        # не собирается индекс и не тратятся вызовы модели.
        id: mode
        run: |
          set -eu
          "$PYTHON" tools/ai_review.py --mode-report --repo "$GITHUB_WORKSPACE" \
            --workspace "${{ vars.AI_REVIEW_WORKSPACE }}" > mode.json
          cat mode.json
          ENABLED=$("$PYTHON" -c "import json;print('true' if json.load(open('mode.json'))['enabled'] else 'false')")
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          {
            echo "## 🤖 AI-ревью изменений"
            echo
            echo "- режим у проекта: **$ENABLED**"
            "$PYTHON" -c "import json;d=json.load(open('mode.json'));print('- ' + d['reason']);print('- файл проекта: \`%s\`' % d['workspace']);print('- проект: %s' % (d['project'] or '—'));print('- ключ модели: %s' % ('есть' if d['key'] else 'нет — ' + d['key_reason']))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Node.js (для MCP-сервера git)
        if: ${{ steps.mode.outputs.enabled == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Кэш зависимостей MCP-сервера
        if: ${{ steps.mode.outputs.enabled == 'true' }}
        # На self-hosted раннере выкладка кода обновляется каждый прогон, а
        # `node_modules` от неё не зависит: держим его в кэше по замку версий.
        uses: actions/cache@v4
        with:
          path: mcp_servers/node_modules
          key: mcp-node-${{ hashFiles('mcp_servers/package-lock.json') }}

      - name: Зависимости MCP-сервера git
        if: ${{ steps.mode.outputs.enabled == 'true' }}
        # Сервер `git` — тот же, что в чате: он один отвечает за то, ЧТО видит
        # ревью (ветка против базовой, окна diff'а, закрытые пути). Зависимости
        # ставятся по замку из репозитория.
        env:
          # КЭШ NPM — ВНУТРИ РАБОЧЕЙ КОПИИ ЗАДАЧИ, а не в домашнем каталоге
          # пользователя: у своей машины глобальный кэш бывает попорчен
          # (root-owned файлы после `sudo npm install`), и тогда `npm ci` падает с
          # EPERM ещё до установки — живой случай 14.10 на этой машине.
          npm_config_cache: ${{ github.workspace }}/.npm-cache
        run: |
          set -eu
          if [ -d mcp_servers/node_modules/@modelcontextprotocol ]; then
            # Кэш задачи уже разложил зависимости — ставить заново нечего.
            echo "Зависимости MCP-сервера на месте (из кэша задачи)."
          else
            npm ci --prefix mcp_servers
          fi

      - name: Чем будут считаться эмбеддинги
        if: ${{ steps.mode.outputs.enabled == 'true' }}
        # ПОКАЗЫВАЕТ, а не обещает: на своей машине с пакетом эмбеддингов и кэшем
        # моделей поиск по коду семантический, в облаке — встроенный офлайн-бэкенд.
        # Раньше этого не видно, и «RAG вроде работал» ничем не подтверждалось.
        env:
          AI_REVIEW_INDEX_DIR: ${{ vars.AI_REVIEW_INDEX_DIR }}
        run: |
          if [ -n "${AI_REVIEW_INDEX_DIR}" ]; then
            export RAG_DIR="${AI_REVIEW_INDEX_DIR}"
          fi
          "$PYTHON" - <<'PY'
          import json
          from app.ai import rag_embedding
          state = rag_embedding.backend_status()
          print(json.dumps({key: state[key] for key in
                            ("requested", "backend", "model", "reason", "cache_dir")},
                           ensure_ascii=False, indent=2))
          PY

      - name: Разбор изменений
        if: ${{ steps.mode.outputs.enabled == 'true' }}
        id: review
        # Сбой шага не роняет прогон сразу: причину надо ещё показать в итоге и
        # в комментарии, а решение «красный или зелёный» принимается ниже.
        #
        # PIP-ЗАВИСИМОСТЕЙ НЕТ И НЕ НУЖНО: вход пайплайна и всё, что он тянет
        # (конфигурация, HTTP-слой модели, MCP-клиент, работа с проектом),
        # написаны на стандартной библиотеке — проверено импортом с запретом
        # fastapi/pydantic/torch. Тяжёлое (fastapi, sentence-transformers) нужно
        # веб-приложению и индексации, а ревью работает без них.
        continue-on-error: true
        env:
          # КЛЮЧ МОДЕЛИ ПРИХОДИТ ОТТУДА, ГДЕ ОН ЕСТЬ, — и не перебивается пустым:
          #   * секрет репозитория (облачный раннер: своего .env у него нет);
          #   * окружение раннера (своя машина: job наследует переменные процесса,
          #     а `tools/review_runner.sh start` передаёт ему ключ из .env проекта —
          #     на своей машине секрет НЕ нужен).
          # Прямо в `DEEPSEEK_API_KEY` секрет подставлять нельзя: если он не
          # заведён, переменная стала бы ПУСТОЙ и перебила бы унаследованный ключ.
          AI_REVIEW_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # На своей машине кэш моделей эмбеддингов лежит в проекте — тогда
          # семантический поиск работает БЕЗ сети (HF_HUB_OFFLINE внутри проекта).
          RAG_MODEL_CACHE: ${{ vars.RAG_MODEL_CACHE }}
        run: |
          set -o pipefail
          if [ -n "${AI_REVIEW_KEY:-}" ]; then
            export DEEPSEEK_API_KEY="$AI_REVIEW_KEY"
            echo "Ключ модели: взят из секрета репозитория."
          elif [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "Ключ модели: унаследован от раннера (своя машина, .env проекта)."
          else
            echo "::notice::Ключа модели нет: ревью не будет выполнено (это не сбой — причина в итоге прогона)."
          fi
          # ИНДЕКС КОДА — ВНЕ РАБОЧЕЙ КОПИИ (если переменная задана): на своей
          # машине он тогда переживает выкладку кода, и ревью не пересобирает его
          # на каждом прогоне.
          if [ -n "${{ vars.AI_REVIEW_INDEX_DIR }}" ]; then
            INDEX_ARGS="--index-dir ${{ vars.AI_REVIEW_INDEX_DIR }}"
          else
            # Каталог индекса обычно приходит из окружения раннера
            # (AI_REVIEW_INDEX_DIR у self-hosted: индекс вне рабочей копии).
            INDEX_ARGS=""
          fi
          # РЕЖИМ RAG. На СВОЕЙ машине он обязателен: там есть пакет эмбеддингов и
          # кэш моделей, и «ревью без индекса» означало бы, что поиск по коду
          # молча не работает. В облаке — с откатом на отбор контекста кодом.
          # Переменная AI_REVIEW_RAG перекрывает умолчание.
          RAG_MODE="${{ vars.AI_REVIEW_RAG }}"
          if [ -z "$RAG_MODE" ]; then
            if [ "${{ runner.environment }}" = "self-hosted" ]; then RAG_MODE=on; else RAG_MODE=auto; fi
          fi
          echo "Режим RAG: $RAG_MODE"
          "$PYTHON" tools/ai_review.py \
            --base "origin/${{ github.base_ref }}" \
            --repo "$GITHUB_WORKSPACE" \
            --workspace "${{ vars.AI_REVIEW_WORKSPACE }}" \
            --rag "$RAG_MODE" \
            $INDEX_ARGS \
            --out review.md \
            --json review.json \
            --quiet \
            2>&1 | tee review.log

      - name: Итог прогона при выключенном режиме
        if: ${{ steps.mode.outputs.enabled != 'true' }}
        run: |
          echo "Режим AI-ревью у проекта выключен — ревью не запускалось." >> "$GITHUB_STEP_SUMMARY"
          echo "Включить: команда /ai_review_enable в чате проекта." >> "$GITHUB_STEP_SUMMARY"

      - name: Итог прогона
        # Итог пишется ВСЕГДА: и когда ревью сделано, и когда оно честно не
        # делалось по настройке (нет ключа, режим выключен), и когда прогон
        # сорвался. В последнем случае причина названа словами.
        if: ${{ always() && steps.mode.outputs.enabled == 'true' }}
        run: |
          {
            echo "## 🤖 AI-ревью изменений"
            echo
            if [ -f review.md ] && [ -s review.md ]; then
              head -c 40000 review.md
            else
              echo "Отчёта нет: ревью не выполнено."
            fi
            echo
            echo "---"
            if [ -f review.json ]; then
              echo '```json'
              cat review.json
              echo '```'
            fi
            echo "Полный журнал прогона — в артефакте \`ai-review\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Комментарий к pull request
        id: comment
        # Комментарий — ОТДЕЛЬНЫЙ шаг и с правом на ошибку: у pull request из
        # форка токен только на чтение, и падать из-за этого ревью не должно
        # (отчёт всё равно есть в итоге прогона и в артефакте).
        #
        # ПУБЛИКАЦИЯ ЧЕРЕЗ curl, А НЕ ЧЕРЕЗ gh. `gh` есть на облачных раннерах, но
        # на СВОЕЙ машине его обычно нет: шаг падал внутри («gh: command not
        # found»), а `continue-on-error` показывал его успешным — комментарий не
        # появлялся вовсе, и это выглядело как «ревью промолчало» (живой случай
        # 14.10 на этой машине). curl и python на своей машине проверены скриптом
        # `tools/review_runner.sh check`.
        if: ${{ steps.mode.outputs.enabled == 'true' && steps.review.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Отчёта нет (ревью не делалось по настройке или сорвалось) — и
          # комментировать нечего: пустой комментарий под pull request только
          # мешает читать обсуждение.
          if [ ! -s review.md ]; then
            echo "Отчёта нет — комментарий не публикуется."
            exit 0
          fi
          MARK="<!-- ai-review-report -->"
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          API="${{ github.api_url }}/repos/$REPO/issues/$PR/comments"
          # МАРКЕР НУЖЕН, ЧТОБЫ ОБНОВЛЯТЬ СВОЙ КОММЕНТАРИЙ, А НЕ ПЛОДИТЬ НОВЫЕ:
          # каждый push в ветку запускает ревью заново, и десяток отчётов под
          # одним pull request читать невозможно.
          printf '%s\n' "$MARK" > body.md
          cat review.md >> body.md
          # Тело запроса собирает python: JSON с многострочным markdown руками не
          # склеить (кавычки, переводы строк, обратные слэши).
          "$PYTHON" -c "import json;print(json.dumps({'body': open('body.md', encoding='utf-8').read()}))" > payload.json
          curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API?per_page=100" -o comments.json
          OLD=$("$PYTHON" -c "import json;d=json.load(open('comments.json'));print(next((c['id'] for c in d if str(c.get('body') or '').startswith('<!-- ai-review-report -->')), ''))")
          if [ -n "${OLD:-}" ]; then
            CODE=$(curl -sS --max-time 30 -o answer.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" --data @payload.json \
              "${{ github.api_url }}/repos/$REPO/issues/comments/$OLD")
            echo "Обновление прежнего комментария ($OLD): HTTP $CODE"
          else
            CODE=$(curl -sS --max-time 30 -o answer.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" --data @payload.json "$API")
            echo "Публикация комментария: HTTP $CODE"
          fi
          case "$CODE" in
            2*) ;;
            *)  # Права только на чтение (форк) или иная причина — называем её, но
                # прогон не роняем: отчёт остаётся в итоге и в артефакте.
                echo "Комментарий не опубликован (HTTP $CODE):"
                head -c 400 answer.json || true
                exit 0 ;;
          esac
          echo "Комментарий ревью опубликован."

      - name: Артефакт с отчётом
        # Артефакт — на случай, когда комментарий поставить не удалось (форк) или
        # когда отчёт хочется посмотреть целиком, вместе с журналом прогона.
        if: ${{ always() && steps.mode.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: |
            review.md
            review.json
            review.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Красный статус только при СБОЕ ревью
        # «Ревью не сделано по настройке» (нет ключа, режим выключен) — не сбой
        # кода: прогон остаётся успешным, причина видна в итоге. А вот сорванное
        # ревью (сервер git недоступен, model не ответила) обязано быть заметным:
        # иначе pipeline молча зеленеет без ревью.
        if: ${{ steps.mode.outputs.enabled == 'true' && steps.review.outcome == 'failure' }}
        run: |
          echo "::error::AI-ревью не выполнено — причина в итоге прогона и в артефакте ai-review"
          exit 1
